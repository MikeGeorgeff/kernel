build:
  nodes:
    analysis:
      environment:
        php:
          version: 8.4.23
      dependencies:
        override:
          - composer install --no-interaction --prefer-dist
      tests:
        override:
          - command: vendor/bin/phpunit --coverage-clover=coverage.clover
            coverage:
              file: coverage.clover
              format: php-clover
          - php-scrutinizer-run
          - phpcs-run --standard=PSR12 src/

checks:
  php: true

coding_style:
  php:
    spaces:
      around_operators:
        concatenation: true

tools:
  external_code_coverage:
    timeout: 600
